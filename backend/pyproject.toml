[project]
name = "cafe-fausse-backend"
version = "0.1.0"
description = "Café Fausse reservations & newsletter API (Flask + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
